services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: node:20-alpine
    working_dir: /app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: change_me_access
      JWT_REFRESH_SECRET: change_me_refresh
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      NODE_ENV: development
      TELEGRAM_BOT_TOKEN: change_me_telegram
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - db
      - redis
    ports:
      - "4000:4000"
    command: sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm install; fi && npx prisma db push && npx prisma generate && npm run dev"

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_TELEGRAM_BOT_NAME: change_me_bot
      VITE_TELEGRAM_BOT_ID: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"
    command: sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then yarn install; fi && yarn dev --host 0.0.0.0"

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
